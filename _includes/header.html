<header class="topbar">
  <div class="topbar__inner">
    <button class="icon-btn nav-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" data-nav-toggle>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="/" aria-label="Yclas Help Centre home">
      <img class="brand__logo brand__logo--light" src="/assets/img/yclas_logo_long_normal.svg" alt="Yclas" width="98" height="30">
      <img class="brand__logo brand__logo--dark" src="/assets/img/yclas_logo_long_white.svg" alt="" width="98" height="30">
      <span class="brand__tag">Help Centre</span>
    </a>
    <button class="search-trigger" type="button" data-search-open aria-label="Search the Help Centre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search guides</span>
      <kbd>/</kbd>
    </button>
    <nav class="topbar__links" aria-label="Yclas">
      <a href="https://yclas.com/">yclas.com</a>
      <a class="btn btn--primary btn--sm" href="https://yclas.com/panel/support/index">Contact support</a>
    </nav>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="search" data-search hidden>
  <div class="search__backdrop" data-search-close></div>
  <div class="search__panel" role="dialog" aria-modal="true" aria-label="Search the Help Centre">
    <div class="search__field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" role="combobox" aria-expanded="true" aria-controls="search-results" aria-autocomplete="list" data-search-input placeholder="Search for a guide, a setting or a problem…" autocomplete="off" spellcheck="false" aria-label="Search">
      <button type="button" class="search__esc" data-search-close>Esc</button>
    </div>
    <ul class="search__results" id="search-results" data-search-results role="listbox" aria-label="Results"></ul>
    <p class="search__empty" data-search-empty hidden>No guides match that yet. Try another word, or <a href="https://yclas.com/panel/support/index">ask our support team</a>.</p>
  </div>
</div>
