<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.url == "/" -%}
    {%- assign page_title = site.title -%}
  {%- else -%}
    {%- assign page_title = page.title | append: " · " | append: site.title -%}
  {%- endif %}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="article">
  <meta property="og:image" content="{{ '/assets/img/og-help-centre.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2B59F0">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/docs.css?v={{ site.time | date: '%s' }}">
  <script>
    // Apply the saved light/dark choice before the page paints.
    try { var t = localStorage.getItem('yc-docs-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="/assets/js/search-core.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/docs.js?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
