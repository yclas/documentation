# Yclas Help Centre — built by GitHub Pages from the gh-pages branch and served at docs.yclas.com.
# Every article is a Markdown page with front matter (see README.md); the sidebar, section pages and search
# are generated from that front matter, so adding an article never means editing a navigation file.

title: Yclas Help Centre
description: Guides for building and running your marketplace on Yclas — listings, payments, design, users and more.
url: https://docs.yclas.com
baseurl: ""
lang: en
github_repo: yclas/documentation
github_branch: gh-pages

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: doc

exclude:
  - README.md
  - LICENSE
  - LICENSE-BSD.txt
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - script
